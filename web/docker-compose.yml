services:
  karvon-web:
    build: .
    container_name: karvon-web
    restart: unless-stopped
    env_file: .env
    environment:
      - COOKIE_SECURE=1
      # Scheduler for source sync / alerts / FX / health checks. JOBS_SECRET must be set in .env.
      - JOBS_ENABLED=1
    # 127.0.0.1:3100 stays for local debugging on the server itself. Public access goes through
    # the shared `finexa-caddy` reverse proxy instead, which reaches this container by name over
    # the `analyzer_analyzer` network (the same pattern every other project on this box uses —
    # see kinetix-api/kinetix-admin's blocks in /opt/finexa/docker/Caddyfile) rather than via the
    # host-published port.
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      - default
      - analyzer_analyzer
    depends_on:
      karvon-db:
        condition: service_healthy
    # This box runs a dozen other people's production projects. A memory leak or a runaway
    # request loop in Karvon shouldn't be able to starve any of them — cap it generously above
    # observed usage (~105MiB idle) rather than leaving it unbounded.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # Postgres co-located with the app, same pattern every other project on this box uses (its own
  # container, its own volume, no host port — reachable only from karvon-web on `default`). The
  # app was pointed at Neon (US East, Ohio); this server is in Tashkent, so every query paid
  # real cross-continent network latency on top of its own work. Running the DB right next to
  # the app removes that entirely.
  karvon-db:
    image: postgres:16-alpine
    container_name: karvon-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=karvon
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=karvon
    volumes:
      - karvon_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karvon"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

networks:
  analyzer_analyzer:
    external: true

volumes:
  karvon_db_data:
