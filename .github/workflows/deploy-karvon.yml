name: Deploy Karvon

# Merging a pull request into master (e.g. "Squash and merge") deploys it, after the CI checks
# pass again on the merged code. "Run workflow" in the Actions tab still works as a manual redeploy.
# Pushes that only touch docs/other folders outside web/ don't deploy.
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-karvon.yml"
  workflow_dispatch: {}

# One deploy at a time; a second merge waits for the first instead of racing it on the server.
concurrency:
  group: deploy-karvon
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KARVON_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.KARVON_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, sync, build and restart karvon-web only
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${{ secrets.KARVON_DEPLOY_USER }}@${{ secrets.KARVON_DEPLOY_HOST }}" '
            set -euo pipefail
            cd /var/www/karvon-src
            git fetch origin master
            git reset --hard origin/master
            rsync -a --delete \
              --exclude=".env" --exclude=".env*" \
              --exclude="data/" --exclude="backups/" \
              --exclude="node_modules/" --exclude=".next/" \
              /var/www/karvon-src/web/ /var/www/karvon/
            cd /var/www/karvon
            docker compose build karvon-web
            # Schema first, code second: a new image that reads a column the DB does not have yet
            # breaks every page that touches it (this took the dashboard down once). Take a
            # backup, apply pending migrations with the NEW image, and only then switch over.
            # `migrate deploy` is a no-op when nothing is pending, and a failure here aborts the
            # deploy (set -e) while the old container keeps serving.
            docker compose up -d karvon-db
            bash backup.sh
            docker compose run --rm --no-deps karvon-web sh -c "DIRECT_URL=\"\${DIRECT_URL:-\$DATABASE_URL}\" npx prisma migrate deploy"
            docker compose up -d karvon-web
          '
