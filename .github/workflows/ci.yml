name: CI

# Runs on every pull request that touches the app, and is reused by the deploy workflow so a
# merge to master is only deployed if the same checks pass.
on:
  # No path filter: the "check" status is required by the master ruleset, so a PR that touches only files outside
  # web/ (docs, CLAUDE.md) would otherwise wait forever for a status that never comes and could not be merged.
  pull_request:
  workflow_call: {}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # postinstall runs `prisma generate` (schema only, no database needed).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
