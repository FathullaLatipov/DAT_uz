name: CI

# Runs on every pull request that touches the app, and is reused by the deploy workflow so a
# merge to master is only deployed if the same checks pass.
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/**"
  workflow_call: {}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # postinstall runs `prisma generate` (schema only, no database needed).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
